name: VJTestKitchen
options:
  bundleIdPrefix: com.bvj303
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  VJTestKitchen:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VJTestKitchen
        excludes:
          - "Resources/Info.plist"
          # The macOS target's plist must not be copied into the iOS app
          # (Info-macOS.plist is consumed via INFOPLIST_FILE on the mac target,
          # not as a resource). Entitlements files (iOS/macOS app + widget) are
          # consumed via CODE_SIGN_ENTITLEMENTS, never bundled as resources.
          - "Resources/Info-macOS.plist"
          - "Resources/*.entitlements"
      # Snapshot models + the App Group store shared with the widget extension.
      - path: Shared
    preBuildScripts:
      # Fail the build (with a clear fix) if project.yml has drifted ahead of
      # this generated project — e.g. after a pull that changed the spec. This
      # deliberately does NOT regenerate mid-build (Xcode has already loaded the
      # old project into memory; rewriting it underneath the running build is
      # racy). The .githooks/ hooks handle regeneration on pull/switch/rebase;
      # this guard is the safety net for a hand-edited project.yml.
      - name: "Guard: project.yml in sync with generated project"
        basedOnDependencyAnalysis: false
        script: |
          if [ "${SRCROOT}/project.yml" -nt "${SRCROOT}/VJTestKitchen.xcodeproj/project.pbxproj" ]; then
            echo "error: project.yml is newer than the generated Xcode project. Run 'xcodegen generate' (or ./.githooks/install.sh once to automate it) and build again."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bvj303.vjtestkitchen
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VJTestKitchen/Resources/Info.plist
        # App Group so the app can publish widget snapshots (see WidgetDataStore).
        CODE_SIGN_ENTITLEMENTS: VJTestKitchen/Resources/VJTestKitchen-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # On-device signing. Baked into the spec (not Xcode's Signing & Capabilities
        # UI) because the .xcodeproj is generated from this file and any UI change
        # would be lost on the next `xcodegen generate`. 89R449GG5Z is Brendan's
        # team — now a **paid** Apple Developer Program membership (individual
        # enrollment upgraded the former free Personal Team *in place*, same team
        # ID), so provisioning profiles are valid ~1 year, not 7 days. No team-ID
        # swap needed. Simulator builds ignore this.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 89R449GG5Z
    dependencies:
      - package: Supabase
        product: Supabase
      # Embed the iOS widget extension into the app bundle.
      - target: VJTestKitchenWidgets
        embed: true

  # Native macOS app. Shares the SAME VJTestKitchen/ source glob as the iOS
  # target (so all shared code + the Platform/ shims are picked up automatically)
  # but carries its own Info.plist, deployment target, and device-family setting.
  # Runs under App Sandbox (see VJTestKitchen-macOS.entitlements) — network
  # client + location + calendars, which also gives it a per-app keychain (no
  # repeated keychain prompts). Signing is still local dev; Mac App Store /
  # Developer ID distribution is a later step.
  VJTestKitchenMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VJTestKitchen
        excludes:
          - "Resources/Info.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/*.entitlements"
      # Snapshot models + the App Group store shared with the widget extension.
      - path: Shared
    preBuildScripts:
      - name: "Guard: project.yml in sync with generated project"
        basedOnDependencyAnalysis: false
        script: |
          if [ "${SRCROOT}/project.yml" -nt "${SRCROOT}/VJTestKitchen.xcodeproj/project.pbxproj" ]; then
            echo "error: project.yml is newer than the generated Xcode project. Run 'xcodegen generate' (or ./.githooks/install.sh once to automate it) and build again."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bvj303.vjtestkitchen
        # Leave PRODUCT_NAME defaulting to the target name (VJTestKitchenMac) so
        # xcodegen's auto-derived TEST_HOST path resolves; the user-facing name
        # is set via CFBundleName in Info-macOS.plist.
        #
        # Pin the Swift module name to VJTestKitchen (not the target name) so the
        # shared test sources' `@testable import VJTestKitchen` resolves against
        # this target the same as it does for the iOS app.
        PRODUCT_MODULE_NAME: VJTestKitchen
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VJTestKitchen/Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: VJTestKitchen/Resources/VJTestKitchen-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Clear the inherited iOS "1,2" device family; macOS ignores it.
        TARGETED_DEVICE_FAMILY: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 89R449GG5Z
    dependencies:
      - package: Supabase
        product: Supabase
      # Embed the macOS (desktop) widget extension into the app bundle.
      - target: VJTestKitchenMacWidgets
        embed: true

  # Widget extensions. Both share the SAME VJTestKitchenWidgets/ + Shared/ source
  # glob (like the two app targets), differing only in platform, entitlements,
  # and the App Group id form (bare group. on iOS, Team-ID-prefixed on macOS —
  # see WidgetSharedConfig). Display-only: they read snapshots the app publishes
  # to the App Group container, so they need no Supabase/network dependency.
  VJTestKitchenWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VJTestKitchenWidgets
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bvj303.vjtestkitchen.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VJTestKitchenWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: VJTestKitchen/Resources/VJTestKitchenWidgets-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 89R449GG5Z

  VJTestKitchenMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VJTestKitchenWidgets
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bvj303.vjtestkitchen.widgets
        # Distinct module name from the iOS widget target, same as the app pair.
        PRODUCT_MODULE_NAME: VJTestKitchenWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VJTestKitchenWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: VJTestKitchen/Resources/VJTestKitchenWidgets-macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 89R449GG5Z

  VJTestKitchenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VJTestKitchenTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VJTestKitchen

  # Same test sources as the iOS suite, compiled for macOS — the CI proof that
  # the Platform/ shims behave on the platform that actually differs.
  VJTestKitchenMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VJTestKitchenTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VJTestKitchenMac

schemes:
  VJTestKitchen:
    build:
      targets:
        VJTestKitchen: all
        VJTestKitchenTests: [test]
    test:
      targets:
        - VJTestKitchenTests
    run:
      config: Debug

  VJTestKitchenMac:
    build:
      targets:
        VJTestKitchenMac: all
        VJTestKitchenMacTests: [test]
    test:
      targets:
        - VJTestKitchenMacTests
    run:
      config: Debug
