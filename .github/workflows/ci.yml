name: CI

# Runs the full test suite as a merge gate (Engineering Principles: "deploys
# come from the pipeline" — this is the CI half; CD lands in a later phase).
#
# Verified on the `macos-26` image (Xcode 26.0.1): the macOS sandboxed test host
# launches with ad-hoc signing and the Deno checks pass. The image ships Xcode 26
# but NOT the iOS 26 simulator runtime, so the iOS job downloads it (see the
# "Install the iOS 26 simulator runtime" step). If you're on a different plan/
# image, adjust the `runs-on` label and the setup-xcode version accordingly.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS build & unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Seed placeholder secrets
        # Real Supabase values aren't needed to compile or run the unhosted unit
        # tests — AppConfigTests injects its own synthetic Bundle. The build only
        # needs the xcconfig vars *defined* for Info.plist substitution.
        run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install the iOS 26 simulator runtime
        # The macos-26 image ships Xcode 26 but NOT the iOS 26 simulator runtime,
        # and this app's deployment target is iOS 26 — so the app can't install on
        # any older runtime. Download the runtime for the selected Xcode.
        run: xcodebuild -downloadPlatform iOS

      - name: Create an iOS 26 simulator
        id: sim
        # Downloading a runtime doesn't auto-create devices, so make one explicitly
        # from the newest available iOS runtime + any iPhone device type.
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable') and x.get('platform')=='iOS']; print(r[-1] if r else '')")
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'iPhone' in x['name']]; print(d[-1] if d else '')")
          if [ -z "$RUNTIME" ] || [ -z "$DEVTYPE" ]; then echo 'No iOS runtime / iPhone device type available'; xcrun simctl list runtimes; exit 1; fi
          echo "Runtime=$RUNTIME  DeviceType=$DEVTYPE"
          UDID=$(xcrun simctl create ci-iphone "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID" || true
          echo "Created simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VJTestKitchen \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults-iOS.xcresult
          if-no-files-found: ignore

  macos-tests:
    name: macOS build & unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Seed placeholder secrets
        run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS unit tests
        # The mac target runs under App Sandbox; on some runners the sandboxed
        # test host may need a real signing identity to launch. Ad-hoc ('-')
        # works locally — if the test host fails to launch in CI, add a keychain
        # step that imports a Development cert and drop the CODE_SIGNING_* flags.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VJTestKitchenMac \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults-macOS.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: TestResults-macOS.xcresult
          if-no-files-found: ignore

  edge-functions:
    name: Edge Function checks (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check functions
        run: |
          deno check supabase/functions/ai-chat/index.ts
          deno check supabase/functions/delete-account/index.ts

      - name: Run function tests
        run: deno test --allow-net supabase/functions/
