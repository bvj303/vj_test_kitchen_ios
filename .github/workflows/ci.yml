name: CI

# Runs the full test suite as a merge gate (Engineering Principles: "deploys
# come from the pipeline" — this is the CI half; CD lands in a later phase).
#
# The iOS job runs on the `xcode-27` image (release Xcode 27.1 — the iPhone Duo
# layout uses iOS 27.1 SDK APIs; iOS deployment target stays 27.0); the macOS job stays on `macos-26` / Xcode 26 (macOS target 26.0). The image
# ships Xcode but NOT the matching iOS simulator runtime, so the iOS job
# downloads it (see the "Install the iOS 27 simulator runtime" step). If you're on a different plan/
# image, adjust the `runs-on` label and the setup-xcode version accordingly.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS build & unit tests
    # `xcode-27` (GitHub public preview, actions/runner-images#14404): macos-26
    # tops out at Xcode 26.6, which can't build the iOS 27.0 deployment target.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        # The iOS/iPadOS deployment target is 27.0 (DECISIONS.md, 2026-09-28), but the
        # iPhone Duo layout calls iOS 27.1 SDK APIs (ReservedRegion, ArrangementView,
        # toolbarVerticalCompressionBehavior) behind `#available` — which guards at
        # runtime only, so they don't compile against the 27.0 SDK. Pinned (not
        # latest-stable) so a runner image without Xcode 27.1 fails loudly here.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Seed placeholder secrets
        # Real Supabase values aren't needed to compile or run the unhosted unit
        # tests — AppConfigTests injects its own synthetic Bundle. The build only
        # needs the xcconfig vars *defined* for Info.plist substitution.
        run: |
          cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
          cp Config/Secrets.staging.xcconfig.example Config/Secrets.staging.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install the iOS 27 simulator runtime
        # The runner image ships Xcode but NOT the matching iOS simulator runtime,
        # and this app's iOS deployment target is 27 — so the app can't install on
        # any older runtime. Download the runtime for the selected Xcode.
        run: xcodebuild -downloadPlatform iOS

      - name: Create an iOS 27 simulator
        id: sim
        # Downloading a runtime doesn't auto-create devices, so make one explicitly.
        # Pick the iPhone from the newest iOS runtime's OWN supportedDeviceTypes list
        # rather than the newest device type by name: the two drift apart (Xcode 27.1's
        # iOS 27.1 runtime supports only iPhone Duo, so "highest-numbered iPhone" chose
        # iPhone 18 Pro Max and simctl rejected it as "Incompatible device").
        # Preference: highest-numbered regular iPhone the runtime supports, else any
        # iPhone it supports (e.g. iPhone Duo).
        run: |
          read -r RUNTIME DEVTYPE < <(xcrun simctl list runtimes -j | python3 -c "
          import json, re, sys
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('platform') == 'iOS']
          rts.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          for r in reversed(rts):
              phones = [d for d in r.get('supportedDeviceTypes', []) if d.get('productFamily') == 'iPhone']
              if not phones:
                  continue
              num = lambda d: int(m.group(1)) if (m := re.search(r'(\\d+)', d['name'])) else -1
              phones.sort(key=lambda d: (num(d) >= 0, num(d)))
              print(r['identifier'], phones[-1]['identifier'])
              break
          ")
          if [ -z "${RUNTIME:-}" ] || [ -z "${DEVTYPE:-}" ]; then echo 'No iOS runtime with a supported iPhone device type'; xcrun simctl list runtimes; exit 1; fi
          echo "Runtime=$RUNTIME  DeviceType=$DEVTYPE"
          UDID=$(xcrun simctl create ci-iphone "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID" || true
          echo "Created simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VJTestKitchen \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults-iOS.xcresult
          if-no-files-found: ignore

  macos-tests:
    name: macOS build & unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Seed placeholder secrets
        run: |
          cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
          cp Config/Secrets.staging.xcconfig.example Config/Secrets.staging.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS unit tests
        # The mac target runs under App Sandbox; on some runners the sandboxed
        # test host may need a real signing identity to launch. Ad-hoc ('-')
        # works locally — if the test host fails to launch in CI, add a keychain
        # step that imports a Development cert and drop the CODE_SIGNING_* flags.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VJTestKitchenMac \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults-macOS.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: TestResults-macOS.xcresult
          if-no-files-found: ignore

  edge-functions:
    name: Edge Function checks (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check functions
        run: |
          deno check supabase/functions/ai-chat/index.ts
          deno check supabase/functions/delete-account/index.ts

      - name: Run function tests
        run: deno test --allow-net supabase/functions/
